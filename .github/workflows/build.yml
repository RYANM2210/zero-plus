name: build

# Every push runs both solvers against each other and, if they agree, rebuilds
# the page and publishes it. Nobody has to remember to do either.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      fuzz_count:
        description: How many random circuits to cross-check
        default: "500"

# Matches GitHub's own two-job Pages template: the scopes sit at the top so the
# build job can configure Pages and the deploy job can publish to it.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: solvers agree, then build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The cross-check runs the JavaScript solver under Node and compares it
      # to the Python one value by value, so both runtimes are needed.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cross-check the two solvers
        run: python run_tests.py ${{ inputs.fuzz_count || '500' }}

      - name: Build the distributable files
        run: python package.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/zero-plus-offline.html _site/index.html
          cp dist/zero-plus-offline.html _site/zero-plus-offline.html
          cp dist/zeroplus.pyz _site/zeroplus.pyz
          cp dist/zero-plus.zip _site/zero-plus.zip
          ls -la _site

      - name: Keep the built files on the run
        uses: actions/upload-artifact@v4
        with:
          name: zero-plus-dist
          path: dist/
          retention-days: 90

      - name: Set up Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Package the site for Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: publish to Pages
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
